name: Build HDR shim

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Build DLL
        shell: pwsh
        run: ./build.ps1

      - name: Package DLL
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive -Path build/bin/bcrypt.dll -DestinationPath "parsec-hdr-shim-$sha.zip" -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          files: parsec-hdr-shim-*.zip
          fail_on_unmatched_files: true
